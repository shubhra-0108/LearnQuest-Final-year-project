version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: learnquest
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-learnquest_dev}
      MONGO_INITDB_DATABASE: learnquest
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ML_API_KEY: ${ML_API_KEY:-dev_ml_key}
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      mongo:
        condition: service_healthy

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://learnquest:${MONGO_PASSWORD:-learnquest_dev}@mongo:27017/learnquest?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_prod_min_32chars}
      COOKIE_SECRET: ${COOKIE_SECRET:-dev_cookie_secret_change_in_prod}
      CRYPTO_KEY: ${CRYPTO_KEY:-dev_crypto_key_must_be_32_chars!}
      ML_URL: http://ml-service:8001
      ML_API_KEY: ${ML_API_KEY:-dev_ml_key}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@learnquest.org}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123456}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 20s
      timeout: 10s
      retries: 3

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server
    environment:
      VITE_API_BASE: http://server:5000

volumes:
  mongo_data:
